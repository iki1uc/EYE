:root{--bg:#04070e;--bg2:#0a101e;--fg:#c8d8e8;--dim:#5a7288;--green:#7ce0a8;--gold:#ffcc44;--red:#ff5a7a;--cyan:#5fc8ff;--line:rgba(140,180,220,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px Consolas,'Courier New',monospace}
.app-root{background:var(--bg);color:var(--fg);font:13px Consolas,'Courier New',monospace;padding:14px;max-width:1000px;margin:auto;min-height:100vh}
h1{color:var(--green);font-size:15px;letter-spacing:3px;font-weight:normal}
.sub{color:var(--dim);font-size:11px;margin:4px 0 12px}
h2{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:normal;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.card,.box{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.card .k{color:var(--dim);font-size:10px;letter-spacing:1px}
.card .v{font-size:17px;margin:4px 0;word-break:break-word}
.tag{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.tag.m{color:var(--green)}.tag.a{color:var(--gold)}
.ok{color:var(--green)}.warn{color:var(--gold)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse}
td,th{padding:5px 6px;border-bottom:1px dashed var(--line);text-align:left;font-weight:normal}
th{color:var(--dim);font-size:10px}
canvas{width:100%;height:140px;display:block;background:#02040a;border-radius:4px}
.leg{font-size:10px;margin-top:5px;color:var(--dim)}
button{background:var(--bg2);color:var(--green);border:1px solid var(--green);padding:6px 12px;border-radius:3px;font:inherit;cursor:pointer;margin-top:8px}
button:hover{background:rgba(124,224,168,.12)}
.diamond{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.drow{display:flex;gap:10px;justify-content:center}
.node{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:13px;transition:all .25s}
.node small{font-size:7px;font-weight:normal;opacity:.75}
.node.L{box-shadow:0 0 12px currentColor;transform:scale(1.06)}
.node.off{opacity:.3;transform:scale(.94)}
.n0{color:var(--fg)}.n1{color:#b388ff}.n2{color:var(--cyan)}.n3{color:var(--gold)}
.axbtn{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:6px 11px;margin:0;font-size:11px;letter-spacing:1px}

`,tm=`
<h1>◈ VERWALTUNG · WAHRHEIT LIVE</h1>
<div class="sub">Nur Anzeige. Kein Eingriff. Jeder Wert trägt ein Etikett: <span class="tag m">gemessen</span> = echt, <span class="tag a">abgeleitet</span> = Näherung.</div>

<h2>▸ DEIN RECHNER (echt)</h2>
<div class="grid">
  <div class="card"><div class="k">GRAFIKKARTE</div><div class="v" id="gpu">…</div><span class="tag m">gemessen</span></div>
  <div class="card"><div class="k">PROZESSOR-KERNE</div><div class="v" id="cores">…</div><span class="tag m">gemessen</span></div>
  <div class="card"><div class="k">ARBEITSSPEICHER (Browser-Angabe)</div><div class="v" id="ram">…</div><span class="tag m">gemessen</span></div>
  <div class="card"><div class="k">SPEICHER DIESER SEITE</div><div class="v" id="heap">…</div><span class="tag m">gemessen</span></div>
</div>

<h2>▸ LIVE</h2>
<div class="grid">
  <div class="card"><div class="k">BILDZEIT</div><div class="v" id="ft">…</div><span class="tag m">gemessen</span></div>
  <div class="card"><div class="k">ZEITZITTERN (Timer kommt zu spät)</div><div class="v" id="jit">…</div><span class="tag m">gemessen</span></div>
</div>

<h2>▸ ANNAHME DES ALTEN DASHBOARDS GEGEN WIRKLICHKEIT</h2>
<div class="box">
  <table>
    <tr><th>Teil</th><th>Annahme (alt)</th><th>Jetzt</th><th>Abweichung</th><th></th></tr>
    <tr><td>CPU-Last</td><td>42 %</td><td id="cNow">…</td><td id="cDev">…</td><td><span class="tag a">abgeleitet</span></td></tr>
    <tr><td>GPU-Druck</td><td>55 %</td><td id="gNow">…</td><td id="gDev">…</td><td><span class="tag a">abgeleitet</span></td></tr>
    <tr><td>Seiten-RAM</td><td>48 %</td><td id="rNow">…</td><td id="rDev">…</td><td><span class="tag a">abgeleitet</span></td></tr>
  </table>
  <div class="leg">CPU aus Zeitzittern, GPU aus Bildzeit gegenüber der besten gesehenen Bildzeit, RAM aus dem Seitenspeicher (nur Chrome/Edge). Näherungen, keine Sensorwerte.</div>
</div>

<h2>▸ URSACHE → WIRKUNG</h2>
<div class="box">
  <canvas id="cv" width="900" height="140"></canvas>
  <div class="leg"><span style="color:var(--gold)">━ Zeitzittern (Ursache: Prozessor beschäftigt)</span> &nbsp; <span style="color:var(--cyan)">━ Bildzeit (Wirkung)</span> &nbsp; · letzte 30 Sekunden</div>
  <div id="lag" style="margin-top:8px">Sammle Daten …</div>
  <button id="burn">⚡ Test: diese Seite 1,5 s belasten</button>
  <span class="leg">&nbsp;Belastet nur diese Seite, nicht deinen Rechner. Danach siehst du Ursache und Wirkung in der Kurve.</span>
</div>

<h2>▸ ACHSEN · DISPATCHER</h2>
<div class="box">
  <div id="axis-buttons" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
  <div id="axis-focus" class="leg">Klick eine Achse: Sie wird im Baum markiert, mit Pfad und Signal. Es wird nirgends hin navigiert.</div>
</div>

<h2>▸ LOGIK · Rt(x) = Rt(parent(x)) ∧ R(x) · MESSUNG → R → L → SNAPSHOT → HANDOFF</h2>
<div class="box">
  <div id="hand" style="font-size:20px;margin-bottom:4px">…</div>
  <div class="diamond" id="diamond"></div>
  <div id="chain">…</div>
  <div id="logicVerdict" class="leg"></div>
  <table style="margin-top:10px"><thead><tr><th>sym</th><th>parent</th><th>signal</th><th>Wert</th><th>R</th><th>L</th></tr></thead><tbody id="logicRows"></tbody></table>
  <div class="leg" style="margin-top:8px">Die Reihenfolge der Prüfkette ist festgelegt und kein Ursachenbeweis. ⊤ nur, wenn jede Ebene ⊤ ist. Nicht messbar = ⊥, nie „bestanden“.</div>
  <div class="leg" id="snapinfo"></div>
</div>

<h2>▸ RUNTIME-KETTE · Rt0 → Rt1 → Rt2 → … → ZIEL</h2>
<div class="box">
  <div id="rtchain" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"></div>
  <div id="rtdetail" class="leg" style="margin-top:6px"></div>
  <button id="bStep">▸ STEP: neue Runtime aus der Messung</button>
  <button id="bHand" style="color:var(--gold);border-color:var(--gold)">⇢ HANDOFF als ZIEL</button>
  <button id="bReset" style="color:var(--dim);border-color:var(--line)">⟲ RESET</button>
  <div class="leg">Jede Runtime ist ein eingefrorener Schnappschuss der echten Messung. Neue Runtime entsteht automatisch, wenn sich die Kette ändert (höchstens 1× pro Sekunde), oder per STEP. HANDOFF geht nur, wenn die Kette ⊤ ist.</div>
  <div id="proto"></div>
</div>

<div class="sub" style="margin-top:14px">Grün ist hier nicht garantiert. Wahrheit hat Vorrang vor Wohlfühlen. \uD83D\uDE09</div>
